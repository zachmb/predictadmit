<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700;6..72,800&family=Inter:wght@400;500;600;700;800;900&display=swap"
			rel="stylesheet"
		/>
		<!-- Google tag (gtag.js) -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-W6WB354WGW"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag() {
				dataLayer.push(arguments);
			}
			gtag('js', new Date());

			gtag('config', 'G-W6WB354WGW');
		</script>
		%sveltekit.head%

		<!-- Favente (favente.so): recruits our signed-in users into paid creators
		     who make short videos about PredictAdmit. The stub queues any
		     Favente.track()/recruit() calls fired before the async pixel finishes
		     loading; the pixel below is present site-wide on every page. -->
		<script>
			window.Favente = window.Favente || {};
			['recruit', 'track'].forEach(function (m) {
				window.Favente[m] =
					window.Favente[m] ||
					function () {
						(window.Favente.q = window.Favente.q || []).push([m, arguments]);
					};
			});
		</script>
		<script async src="https://api.favente.so/embed/predictadmit/init.js" data-mode="fab"></script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
